<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Sitio Web - Contacto</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header class="cabecera">
        <h1>Mi Portfolio Personal</h1>
        <p>Desarrollador Web en formación</p>
    </header>

    <nav class="menu">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="sobre.html">Sobre mí</a></li>
            <li><a href="contacto.html" class="activo">Contacto</a></li>
        </ul>
    </nav>

    <main>
        <section class="tarjeta">
            <h2>Contacto</h2>
            <p>¿Quieres ponerte en contacto conmigo? Rellena el formulario y te responderé lo antes posible.</p>

            <form class="formulario" action="#" method="post">
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="campo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="campo">
                    <label for="asunto">Asunto</label>
                    <input type="text" id="asunto" name="asunto">
                </div>

                <div class="campo">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="6" required></textarea>
                </div>

                <button type="submit" class="boton">Enviar</button>
            </form>
        </section>
    </main>

    <footer class="pie">
        <p>&copy; 2025 Mi Portfolio Personal. Todos los derechos reservados.</p>
        <p class="copy-peq">Diseñado para la clase de DIW.</p>
    </footer>

</body>
</html>
